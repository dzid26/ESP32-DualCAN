name: Firmware CI

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            firmware/.cache
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}-core6.2.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned for reproducibility — platform 55.03.312 requires Core >=6.2.0.
      # Upstream drift is surfaced deliberately by the scheduled canary workflow.
      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Run native tests
        run: pio test -d firmware -e tests-native

  build:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            firmware/.cache
            firmware/.pio
          key: pio-esp32c6-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.defaults') }}-core6.2.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned for reproducibility — platform 55.03.312 requires Core >=6.2.0.
      # Upstream drift is surfaced deliberately by the scheduled canary workflow.
      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Build production firmware
        run: pio run -d firmware -e esp32-c6

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/.pio/build/esp32-c6/firmware.bin
