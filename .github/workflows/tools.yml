name: Tools CI

on:
  push:
    paths:
      - 'tools/seed-pio-cache.mjs'
      - 'tools/seed-pio-cache.test.mjs'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tools/seed-pio-cache.mjs'
      - 'tools/seed-pio-cache.test.mjs'
      - '.github/workflows/tools.yml'

permissions:
  contents: read

jobs:
  seed-cache:
    name: Seed cache tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test tools/seed-pio-cache.test.mjs
